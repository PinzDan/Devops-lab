
name: CI devops-lab

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Test with Maven
      run: ./mvnw -B test

    - name: Docker Build
      run: docker build -t devops-lab:${{github.sha}} .

    - name: Docker run
      id: docker-run-step
      run: docker run --name devops-lab-app -d -p 8080:8080 devops-lab:${{github.sha}}

    - name: Wait Application Response
      run: |
        for i in {1..30}; do
          if curl -fs http://localhost:8080/actuator/health > /dev/null; then
            echo "HealthCheck completed."
            exit 0
          else
            echo "Waiting for a reply ($i/30)..."
            sleep 2
          fi
        done
        echo "L'applicazione non si è avviata entro i tempi previsti."
        exit 1

    - name: Show Docker Logs on Failure
      if: failure() && steps.docker-run-step.conclusion == 'success'
      run: |
        echo "=== LOG DEL CONTAINER ==="
        docker logs devops-lab-app
